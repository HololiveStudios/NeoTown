    /* ---------- Geracao Procedural de Terreno em 2 Fases (FBM + Domain Warping + Hidrologia) ---------- */

    /* ---------- Instanciacao de Edificios Multi-Tile (1x1, 2x2, 3x3) ---------- */

    /* ---------- Ferramentas e Selecao em Area / Multi-Tile ---------- */

    selBegin(x, y) {

    }
    selMove(x, y) { if (!this.ok(x, y)) return; this.cx = x; this.cy = y; if (this.sel) { this.sel.x1 = x; this.sel.y1 = y; } this.buildPreview(); }

    place(i, it) {
      const b = this.bio[i], x = i % this.N, y = (i / this.N) | 0;

    inspect(x, y) {

      const nm = k ? KN[k] : ['Água', 'Planície', 'Floresta', 'Colinas'][this.bio[rawI]];
      const hAvg = this.getTerrainHeight(x, y).toFixed(1);
      L.push(nm + ' (' + x + ',' + y + ') | Alt ' + hAvg + 'm' + (sz > 1 ? ' [' + sz + 'x' + sz + ']' : ''));
      if (this.bText.has(i)) L.push('🏷️ ' + this.bText.get(i));
      if (this.cons.has(i)) L.push('🏗️ Em obra: ' + Math.round(this.cons.get(i).p * 100) + '%');
      if (this.isZone(k) || k === K.SKY_RES || k === K.SKY_COM || k === K.MEGA) {

        if (this.built[i]) L.push('Felicidade ' + this.hap[i] + '%'); if (this.riot[i]) L.push(k === K.IND ? '⚠️ EM GREVE!' : '⚠️ EM PROTESTO!');
      } else if (FAC[k] && FAC[k].r) L.push('Raio ' + FAC[k].r + ' tiles' + (k !== K.PARK && !this.pwOn[i] ? ' | SEM ENERGIA' : ''));
      else if (FAC[k] && FAC[k].pow) L.push('Gera ' + FAC[k].pow + ' MW');
